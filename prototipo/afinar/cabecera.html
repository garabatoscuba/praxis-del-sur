<title>Cabecera de revista</title>
<meta name="description" content="La portada de Praxis del Sur a tamaño real: el nombre centrado, la línea de datos con el ISSN y el sello del CIPS, para comparar.">
<style>
/* La herramienta: una barra arriba con las opciones y, debajo, la portada de verdad (portada.html) a tamaño real en tu pantalla.
   Cada opción es CSS que se inyecta en la portada (solo en pantallas de más de 760 px: el móvil no cambia). */
:root{--bg:#F3F1EC;--surface:#FFFFFF;--fg:#1F1B18;--muted:#57524A;--line:#E0DBD0;--focus:#662426;
  --ui:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15120F;--surface:#1F1B17;--fg:#F1ECE3;--muted:#BEB6A8;--line:#3A342C;--focus:#E0C98A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15120F;--surface:#1F1B17;--fg:#F1ECE3;--muted:#BEB6A8;--line:#3A342C;--focus:#E0C98A;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.45;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.barra{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.barra h1{margin:0;font-size:15px;font-weight:700}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
.seg button{font:inherit;font-size:14px;font-weight:600;padding:6px 13px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.desc{flex:1 1 360px;margin:0;color:var(--muted);font-size:13.5px}
.desc b{color:var(--fg)}
.escena{flex:1;min-height:0;display:grid;place-items:center;background:#D8D2C4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .escena{background:#0E0C0A}}
:root[data-theme="dark"] .escena{background:#0E0C0A}
iframe{display:block;border:0;width:100%;height:100%;background:#4A4844}
.escena.movil iframe{width:390px;height:min(760px,calc(100% - 32px));border-radius:22px;box-shadow:0 0 0 7px #1F1B18}
@media (max-width:700px){.escena.movil iframe{width:100%;height:100%;border-radius:0;box-shadow:none}}
</style>
<header class="barra">
  <h1>Cabecera de revista</h1>
  <div class="seg" role="group" aria-label="Opción">
    <button type="button" data-v="0" aria-pressed="false">A la izquierda</button>
    <button type="button" data-v="1" aria-pressed="false">1 · Centrado</button>
    <button type="button" data-v="2" aria-pressed="false">2 · Con filetes</button>
    <button type="button" data-v="3" aria-pressed="true">3 · Con el sello del CIPS</button>
  </div>
  <div class="seg" role="group" aria-label="Pantalla">
    <button type="button" data-p="real" aria-pressed="true">Tu pantalla</button>
    <button type="button" data-p="movil" aria-pressed="false">Móvil</button>
  </div>
  <p class="desc" id="desc" aria-live="polite"></p>
</header>
<main class="escena" id="escena"><iframe id="portada" src="portada.html" title="Portada de Praxis del Sur"></iframe></main>
<script>
(function(){
  var CSS = '@media (min-width: 761px){\n' + [
    // 1, 2 y 3 · todo centrado: firma, nombre, lema, lo esencial y la línea de datos
    'html[data-cab] .ps-hero-cielo{justify-items:center;text-align:center}',
    'html[data-cab] .ps-hero-marca{align-items:center}',
    'html[data-cab] .ps-esenciales, html[data-cab] .ps-hero-folio{justify-content:center}',
    // 2 y 3 · la línea de datos entre dos filetes finos, como en la cabecera de una revista impresa
    'html[data-cab="2"] .ps-hero-folio, html[data-cab="3"] .ps-hero-folio{padding:9px 20px;border-top:1px solid rgb(222 216 199 / .45);border-bottom:1px solid rgb(222 216 199 / .45)}',
    // 3 · el sello del CIPS (su isotipo, en dorado) delante de «Revista del CIPS»
    'html[data-cab="3"] .ps-hero-firma{display:inline-flex;align-items:center;gap:10px}',
    'html[data-cab="3"] .ps-hero-sello{display:block}'
  ].join('\n') + '\n}';
  var DESC = {
    0: '<b>A la izquierda</b>, como está ahora, ya con la línea de datos: e-ISSN de ejemplo, volumen, ciudad y licencia.',
    1: '<b>Centrado:</b> «Revista del CIPS», el nombre, el lema, lo esencial y la línea de datos, todo al centro. Abajo, la convocatoria sigue igual.',
    2: '<b>Con filetes:</b> lo de la 1, con la línea de datos entre dos filetes finos, como la cabecera de una revista impresa.',
    3: '<b>Con el sello del CIPS:</b> lo de la 2, y el isotipo del CIPS (el cuadrado con el corte) en dorado delante de «Revista del CIPS».'
  };
  var f = document.getElementById('portada'), esc = document.getElementById('escena'), desc = document.getElementById('desc'), v = '3';
  function aplicar(){
    try {
      var d = f.contentDocument; if (!d || !d.documentElement) return;
      if (!d.getElementById('ps-cab')) { var st = d.createElement('style'); st.id = 'ps-cab'; st.textContent = CSS; (d.head || d.documentElement).appendChild(st); }
      if (v === '0') d.documentElement.removeAttribute('data-cab'); else d.documentElement.setAttribute('data-cab', v);
    } catch (e) {}
    desc.innerHTML = DESC[v];
  }
  f.addEventListener('load', aplicar);
  function grupo(attr, fn){
    document.querySelectorAll('[' + attr + ']').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('[' + attr + ']').forEach(function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
        fn(b.getAttribute(attr));
      });
    });
  }
  grupo('data-v', function(x){ v = x; aplicar(); });
  grupo('data-p', function(x){ esc.classList.toggle('movil', x === 'movil'); });
  aplicar();
})();
</script>
